services:
  - type: web
    name: parkpass-api
    env: node
    plan: free
    buildCommand: npm install --include=dev && npx prisma generate && npm run build:api
    startCommand: npm run start:api
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: COOKIE_SECRET
        generateValue: true
