<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="blueGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6"/>
      <stop offset="50%" stop-color="#2563eb"/>
      <stop offset="100%" stop-color="#1d4ed8"/>
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#60a5fa"/>
      <stop offset="100%" stop-color="#93c5fd"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#1e3a8a" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- Background squircle -->
  <rect x="24" y="24" width="464" height="464" rx="108" fill="url(#blueGrad)" filter="url(#shadow)"/>

  <!-- Subtle inner border -->
  <rect x="28" y="28" width="456" height="456" rx="104" fill="none" stroke="#60a5fa" stroke-width="3" opacity="0.3"/>

  <!-- Shield Shape background -->
  <path d="M256 90 L380 144 V260 C380 340 326 405 256 428 C186 405 132 340 132 260 V144 Z" 
        fill="white" opacity="0.08"/>

  <!-- Distinctive 'P' Symbol for Parking & Pass -->
  <!-- Left stem of P -->
  <rect x="175" y="150" width="46" height="212" rx="20" fill="#ffffff"/>

  <!-- Upper bowl of P -->
  <path d="M195 150 H275 C325 150 355 180 355 225 C355 270 325 300 275 300 H195 Z" 
        fill="none" stroke="#ffffff" stroke-width="46" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- High-tech QR corner accent -->
  <rect x="305" y="325" width="38" height="38" rx="8" fill="#60a5fa"/>
  <rect x="317" y="337" width="14" height="14" rx="3" fill="#ffffff"/>

  <!-- Car front silhouette accent at bottom right -->
  <circle cx="280" cy="344" r="8" fill="#93c5fd"/>
</svg>